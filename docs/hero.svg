<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1c"/>
      <stop offset="1" stop-color="#17112b"/>
    </linearGradient>
    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D6F366" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D6F366" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLav" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D5CDFB" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#D5CDFB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPeach" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC3A1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFC3A1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2440"/>
      <stop offset="0.55" stop-color="#2a1f4a"/>
      <stop offset="1" stop-color="#3a2238"/>
    </linearGradient>
    <linearGradient id="paste" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6F366" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D6F366" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="deskClip"><rect x="40" y="40" width="660" height="520" rx="18"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1280" height="600" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="320" fill="url(#glowLav)"/>
  <circle cx="300" cy="520" r="340" fill="url(#glowLime)"/>
  <circle cx="820" cy="560" r="260" fill="url(#glowPeach)"/>

  <!-- ============ desktop mock ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="660" height="520" rx="18" fill="url(#desk)"/>
  </g>
  <g clip-path="url(#deskClip)">
    <circle cx="160" cy="470" r="220" fill="#D6F366" opacity="0.06"/>
    <circle cx="620" cy="520" r="200" fill="#FFC3A1" opacity="0.07"/>
    <!-- menu bar -->
    <rect x="40" y="40" width="660" height="34" fill="#000" opacity="0.35"/>
    <g fill="#fff" font-size="13">
      <path d="M66 50.5c1.1 0 2.3-.8 2.9-1.9.5-.9.6-1.9.4-2.6-1 .1-2.2.7-2.9 1.6-.6.7-.7 1.8-.4 2.9zm4.6 3.3c-1.2-.1-2.3.7-2.9.7-.6 0-1.6-.7-2.6-.6-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.5 2 1 0 1.4-.6 2.6-.6s1.5.6 2.6.6c1.1 0 1.8-1 2.4-2 .8-1.1 1.1-2.2 1.1-2.3 0 0-2.1-.8-2.1-3.2 0-2 1.6-2.9 1.7-3-1-1.4-2.4-1.6-2.9-1.6z" opacity="0.95"/>
      <text x="90" y="62" font-weight="700">Notes</text>
      <text x="142" y="62" opacity="0.9">File</text>
      <text x="176" y="62" opacity="0.9">Edit</text>
      <text x="212" y="62" opacity="0.9">Format</text>
      <text x="268" y="62" opacity="0.9">View</text>
    </g>
    <!-- RumbleBar icon (highlighted, menu open) -->
    <rect x="430" y="44" width="34" height="26" rx="7" fill="#fff" opacity="0.22"/>
    <g fill="#fff">
      <rect x="438" y="55" width="2.4" height="4" rx="1.2"/>
      <rect x="442.4" y="51" width="2.4" height="12" rx="1.2"/>
      <rect x="446.8" y="48" width="2.4" height="18" rx="1.2"/>
      <rect x="451.2" y="52" width="2.4" height="10" rx="1.2"/>
      <rect x="455.6" y="54" width="2.4" height="6" rx="1.2"/>
    </g>
    <!-- other status icons -->
    <g fill="none" stroke="#fff" stroke-width="1.6" opacity="0.85">
      <circle cx="490" cy="57" r="6.5"/>
      <path d="M512 61c3-4 9-4 12 0M515 58.5c1.6-1.8 4.4-1.8 6 0" stroke-linecap="round"/>
      <rect x="538" y="51.5" width="20" height="11" rx="3"/>
    </g>
    <text x="684" y="62" fill="#fff" font-size="13" text-anchor="end" opacity="0.95">Wed 18 Nov  16:43</text>

    <!-- Notes window with pasted text -->
    <g filter="url(#shadow)">
      <rect x="70" y="200" width="300" height="200" rx="12" fill="#1f1f24"/>
    </g>
    <rect x="70" y="200" width="300" height="200" rx="12" fill="none" stroke="#fff" stroke-opacity="0.1"/>
    <circle cx="88" cy="218" r="5.5" fill="#ff5f57"/>
    <circle cx="106" cy="218" r="5.5" fill="#febc2e"/>
    <circle cx="124" cy="218" r="5.5" fill="#28c840"/>
    <text x="220" y="222" fill="#fff" fill-opacity="0.55" font-size="12" text-anchor="middle" font-weight="600">Standup notes</text>
    <g font-size="14" fill="#e9e9ee">
      <text x="88" y="262" fill-opacity="0.55">Completely discombobulated.</text>
      <rect x="84" y="276" width="270" height="48" rx="6" fill="url(#paste)"/>
      <text x="88" y="296">What a surprise, super duper</text>
      <text x="88" y="316">ditty this.</text>
      <rect x="156" y="303" width="2" height="17" fill="#D6F366"/>
    </g>
    <text x="88" y="368" fill="#D6F366" font-size="12" font-weight="600">⌥D  ·  4.5 s of speech → 0.31 s</text>

    <!-- dropdown menu -->
    <g filter="url(#shadow)">
      <rect x="392" y="80" width="292" height="372" rx="12" fill="#2b2b33" fill-opacity="0.96"/>
    </g>
    <rect x="392" y="80" width="292" height="372" rx="12" fill="none" stroke="#fff" stroke-opacity="0.12"/>
    <g font-size="13.5" fill="#f2f2f5">
      <text x="414" y="106" fill-opacity="0.45">Ready — Rumble-2-Flash on MPS</text>
      <rect x="402" y="118" width="272" height="1" fill="#fff" opacity="0.1"/>

      <rect x="400" y="124" width="276" height="26" rx="6" fill="#0a84ff"/>
      <text x="414" y="142" fill="#fff">Start Dictation</text>
      <text x="664" y="142" fill="#fff" text-anchor="end">⌥D</text>
      <rect x="402" y="156" width="272" height="1" fill="#fff" opacity="0.1"/>

      <text x="414" y="180">Language: Auto-detect</text>
      <text x="664" y="180" text-anchor="end" fill-opacity="0.5">›</text>
      <text x="400" y="206" font-size="12">✓</text>
      <text x="414" y="206">Numbers as Digits</text>
      <text x="414" y="232">Keep Filler Words (um, uh)</text>
      <text x="400" y="258" font-size="12">✓</text>
      <text x="414" y="258">Verbatim (keep repeated words)</text>
      <text x="414" y="284">Custom Vocabulary…</text>
      <rect x="402" y="296" width="272" height="1" fill="#fff" opacity="0.1"/>

      <text x="400" y="320" font-size="12">✓</text>
      <text x="414" y="320">Save Debug Recordings</text>
      <text x="414" y="346">Launch at Login</text>
      <text x="414" y="372">Restart Server</text>
      <rect x="402" y="384" width="272" height="1" fill="#fff" opacity="0.1"/>
      <text x="414" y="408">Quit RumbleBar</text>
      <text x="664" y="408" text-anchor="end" fill-opacity="0.5">⌘Q</text>
      <text x="414" y="436" fill-opacity="0.35" font-size="12">Esc cancels while recording</text>
    </g>
  </g>

  <!-- ============ right: title + flow ============ -->
  <g fill="#fff">
    <text x="760" y="104" font-size="50" font-weight="800" letter-spacing="-1">RumbleBar</text>
    <text x="762" y="138" font-size="18" fill-opacity="0.7">Local dictation in your Mac's menu bar,</text>
    <text x="762" y="162" font-size="18" fill-opacity="0.7">powered by <tspan fill="#D6F366" fill-opacity="1" font-weight="600">Reson8 Rumble-2-Flash</tspan>.</text>
  </g>

  <!-- step 1 -->
  <g>
    <rect x="760" y="196" width="460" height="74" rx="14" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.1"/>
    <rect x="778" y="212" width="58" height="42" rx="9" fill="#D5CDFB"/>
    <text x="807" y="240" font-size="18" font-weight="700" fill="#1a1530" text-anchor="middle">⌥D</text>
    <text x="854" y="229" font-size="17" font-weight="650" fill="#fff">Press ⌥D and speak</text>
    <text x="854" y="252" font-size="14" fill="#fff" fill-opacity="0.6">Mic → 16 kHz mono, any app, any text field</text>
  </g>
  <path d="M807 274v20" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- step 2 -->
  <g>
    <rect x="760" y="298" width="460" height="74" rx="14" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.1"/>
    <rect x="778" y="314" width="58" height="42" rx="9" fill="#D6F366"/>
    <g fill="#1a1f08">
      <rect x="792" y="331" width="3.5" height="8" rx="1.75"/>
      <rect x="799" y="325" width="3.5" height="20" rx="1.75"/>
      <rect x="806" y="320" width="3.5" height="30" rx="1.75"/>
      <rect x="813" y="327" width="3.5" height="16" rx="1.75"/>
      <rect x="820" y="331" width="3.5" height="8" rx="1.75"/>
    </g>
    <text x="854" y="331" font-size="17" font-weight="650" fill="#fff">Transcribed on-device</text>
    <text x="854" y="354" font-size="14" fill="#fff" fill-opacity="0.6">Runs on your Mac's GPU; audio never leaves it</text>
  </g>
  <path d="M807 376v20" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- step 3 -->
  <g>
    <rect x="760" y="400" width="460" height="74" rx="14" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.1"/>
    <rect x="778" y="416" width="58" height="42" rx="9" fill="#FFC3A1"/>
    <path d="M800 426h14M807 426v22M800 448h14" stroke="#2a160c" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <text x="854" y="433" font-size="17" font-weight="650" fill="#fff">Pasted where you were typing</text>
    <text x="854" y="456" font-size="14" fill="#fff" fill-opacity="0.6">Your clipboard is restored right after</text>
  </g>

  <!-- stats -->
  <g font-size="14" font-weight="600">
    <rect x="760" y="504" width="118" height="34" rx="17" fill="#D6F366" fill-opacity="0.12" stroke="#D6F366" stroke-opacity="0.45"/>
    <text x="819" y="526" fill="#D6F366" text-anchor="middle">0.5B params</text>
    <rect x="888" y="504" width="128" height="34" rx="17" fill="#D5CDFB" fill-opacity="0.12" stroke="#D5CDFB" stroke-opacity="0.45"/>
    <text x="952" y="526" fill="#D5CDFB" text-anchor="middle">45 languages</text>
    <rect x="1026" y="504" width="150" height="34" rx="17" fill="#FFC3A1" fill-opacity="0.12" stroke="#FFC3A1" stroke-opacity="0.45"/>
    <text x="1101" y="526" fill="#FFC3A1" text-anchor="middle">~40× real-time</text>
  </g>
</svg>
